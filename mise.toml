[tools]
act = "latest"
actionlint = "latest"
bun = "1.3.12"
dbmate = "latest"
git-cliff = "2.12.0"
"github:aptible/supercronic" = "latest"
prek = "latest"
uv = "latest"

[tasks.dev]
description = "Start the API and frontend development servers"
run = "./scripts/development/run-local.sh"

[tasks.setup-hooks]
description = "Install prek-managed repository Git hooks"
run = "./scripts/repository/setup-repo.sh"

[tasks.prek]
description = "Run prek checks against all tracked files"
run = "prek run --all-files"

[tasks.api-install]
description = "Install the API dependencies"
run = "uv sync --directory api --frozen"

[tasks.api-dev]
description = "Start the API development server"
run = "uv run --directory api api-dev"

[tasks.api-lint]
description = "Lint the API"
run = "uv run --directory api ruff check ."

[tasks.api-typecheck]
description = "Type-check the API"
run = "uv run --directory api pyright"

[tasks.api-test]
description = "Test the API"
run = "uv run --directory api pytest -q"

[tasks.frontend-dev]
description = "Start the frontend development server"
run = "bun run --cwd frontend dev"

[tasks.frontend-install]
description = "Install the frontend dependencies"
run = "bun install --cwd frontend --frozen-lockfile"

[tasks.frontend-generate]
description = "Generate the frontend static distribution"
run = "bun run --cwd frontend generate"

[tasks.frontend-test]
description = "Run frontend unit tests"
run = "bun run --cwd frontend test"

[tasks.frontend-typecheck]
description = "Type-check the frontend"
run = "bun run --cwd frontend typecheck"

[tasks.e2e]
description = "Run frontend end-to-end tests"
run = "./scripts/testing/run-e2e-tests.sh"

[tasks.batch-check]
description = "Check the batch application"
run = "cargo check --manifest-path batch/Cargo.toml"

[tasks.batch-fmt]
description = "Format the batch application"
run = "cargo fmt --manifest-path batch/Cargo.toml"

[tasks.batch-fmt-check]
description = "Check batch formatting"
run = "cargo fmt --manifest-path batch/Cargo.toml --check"

[tasks.batch-test]
description = "Test the batch application"
run = "cargo test --manifest-path batch/Cargo.toml"

[tasks.scheduler-test]
description = "Test scheduler configuration rendering"
run = "./scripts/testing/test-scheduler-config.sh"

[tasks.db-up]
description = "Apply SQLite migrations to data/data.db"
run = "mise x -- dbmate -u sqlite:data/data.db up"

[tasks.db-down]
description = "Roll back the latest SQLite migration from data/data.db"
run = "mise x -- dbmate -u sqlite:data/data.db down"

[tasks.docker-up]
description = "Build and start the Docker Compose development environment"
run = "docker compose up --build"

[tasks.docker-down]
description = "Stop the Docker Compose development environment"
run = "docker compose down"

[tasks.act-pr]
description = "Run the pull request workflow locally with act"
run = "act pull_request -W .github/workflows/ci.yml"

[tasks.actions-lint]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.test-all]
description = "Run all repository checks"
run = "./scripts/testing/run-all-tests.sh"

[tasks.docs-screenshots]
description = "Capture application screenshots with Playwright"
run = "./scripts/documentation/capture-screenshots.sh"

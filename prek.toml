minimum_prek_version = "0.4.12"
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
exclude = "^\\.agents/"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"] },
  { id = "check-json", stages = ["pre-commit"] },
  { id = "check-toml", stages = ["pre-commit"] },
  { id = "check-yaml", stages = ["pre-commit"] },
  { id = "check-merge-conflict", stages = ["pre-commit"] },
  { id = "detect-private-key", stages = ["pre-commit"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "api-lint", name = "API lint", language = "system", entry = "mise run api-lint", files = "^api/.*\\.py$", pass_filenames = false, stages = ["pre-commit"] },
  { id = "batch-fmt-check", name = "Batch format check", language = "system", entry = "mise run batch-fmt-check", files = "^(batch/.*\\.rs|batch/Cargo\\.(toml|lock))$", pass_filenames = false, stages = ["pre-commit"] },
  { id = "frontend-typecheck", name = "Frontend typecheck", language = "system", entry = "mise run frontend-typecheck", files = "^frontend/.*\\.(ts|vue)$", pass_filenames = false, stages = ["pre-commit"] },
  { id = "conventional-commit", name = "Conventional Commit message", language = "system", entry = "./scripts/repository/check-commit-message.sh", stages = ["commit-msg"] },
  { id = "repository-tests", name = "Repository tests", language = "system", entry = "mise run test-all", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]

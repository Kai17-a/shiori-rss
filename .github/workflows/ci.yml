name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Sync dependencies
        run: uv sync --directory api --frozen

      - name: Lint
        run: uv run --directory api ruff check .

      - name: Type check
        run: uv run --directory api pyright

      - name: Test
        run: uv run --directory api pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: frontend-bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Prepare Nuxt
        working-directory: frontend
        run: bun run prepare

      - name: Test
        working-directory: frontend
        run: bun run test

      - name: Type check
        working-directory: frontend
        run: bun run typecheck

      - name: Generate distribution
        working-directory: frontend
        run: bun run generate

  batch:
    name: Batch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            batch/target
          key: batch-cargo-${{ runner.os }}-${{ hashFiles('batch/Cargo.lock') }}
          restore-keys: batch-cargo-${{ runner.os }}-

      - name: Check
        working-directory: batch
        run: cargo check

      - name: Check formatting
        working-directory: batch
        run: cargo fmt --check

      - name: Test
        working-directory: batch
        run: cargo test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, frontend]

    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: frontend-bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Sync API dependencies
        run: uv sync --directory api --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: mise run e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/rss-feeder-api-e2e.log
            /tmp/rss-feeder-frontend-e2e.log
            frontend/test-results

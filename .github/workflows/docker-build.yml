name: Docker Build

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - scripts/container/**
      - api/**
      - batch/**
      - db/**
      - frontend/**
      - .github/workflows/docker-build.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - scripts/container/**
      - api/**
      - batch/**
      - db/**
      - frontend/**
      - .github/workflows/docker-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
